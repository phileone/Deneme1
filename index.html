<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Maps IRL - RDR2 Edition</title>
    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div class="controls-panel">
        <div class="location-info">
            <h2>📍 Konumunuz</h2>
            <div id="coordinates">
                <p>Lat: <span id="lat">--</span></p>
                <p>Lng: <span id="lon">--</span></p>
                <p>Doğruluk: <span id="accuracy">--</span>m</p>
            </div>
        </div>

        <div class="controls">
            <button id="centerBtn" class="btn">📍 Konumuma Git</button>
            <button id="lockBtn" class="btn active">🔒 Takip Et</button>
            <button id="zoomInBtn" class="btn">➕ Yaklaş</button>
            <button id="zoomOutBtn" class="btn">➖ Uzaklaş</button>
        </div>

        <div class="poi-legend">
            <h3>🗺️ POI Türleri</h3>
            <div class="legend-items">
                <p><span class="legend-icon">🏪</span> Market</p>
                <p><span class="legend-icon">🍺</span> Bar/Saloon</p>
                <p><span class="legend-icon">⛺</span> Kamp</p>
                <p><span class="legend-icon">🎭</span> Easter Egg</p>
                <p><span class="legend-icon">💎</span> Hazine</p>
                <p><span class="legend-icon">💀</span> Tehlikeli</p>
            </div>
        </div>

        <div class="status-info">
            <p id="status">GPS başlatılıyor...</p>
            <p id="mapInfo">Seviye: <span id="zoomLevel">14</span></p>
            <p id="poiCount">POI: <span id="poiTotal">0</span></p>
        </div>
    </div>

    <script src="node_modules/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
