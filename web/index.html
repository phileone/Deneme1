<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PDF Editör</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#2b2b2b;display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#fff}

/* ── Toolbar ── */
.toolbar{background:#1a1a2e;padding:0 12px;height:52px;display:flex;align-items:center;gap:6px;flex-shrink:0;border-bottom:1px solid #333;flex-wrap:nowrap;overflow-x:auto}
.toolbar-sep{width:1px;height:28px;background:#444;flex-shrink:0;margin:0 4px}
.tb-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:all .15s}
.tb-btn svg{flex-shrink:0}
.tb-open{background:#1565c0;color:#fff}.tb-open:hover{background:#0d47a1}
.tb-merge{background:#37474f;color:#fff}.tb-merge:hover{background:#263238}
.tb-dl{background:#2e7d32;color:#fff}.tb-dl:hover{background:#1b5e20}
.tb-rotate{background:#4a148c;color:#fff}.tb-rotate:hover{background:#38006b}
.tb-del{background:#c62828;color:#fff}.tb-del:hover{background:#8b0000}
.tb-tool{background:#333;color:#ddd;border:2px solid transparent}.tb-tool:hover{background:#444}
.tb-tool.active{background:#0d47a1;color:#fff;border-color:#42a5f5}
.tb-label{font-size:11px;color:#888;padding:0 4px;white-space:nowrap}
.zoom-box{display:flex;align-items:center;gap:4px}
.zoom-box input{width:48px;text-align:center;background:#333;color:#fff;border:1px solid #555;border-radius:5px;padding:4px 6px;font-size:13px}
.zoom-btn{width:26px;height:26px;background:#333;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px;line-height:1}
.zoom-btn:hover{background:#555}

/* ── Layout ── */
.workspace{display:flex;flex:1;overflow:hidden}

/* ── Thumbnails ── */
.thumb-panel{width:140px;background:#1e1e1e;overflow-y:auto;flex-shrink:0;border-right:1px solid #333;padding:8px 6px}
.thumb-item{position:relative;margin-bottom:10px;cursor:pointer;border:2px solid transparent;border-radius:5px;overflow:hidden;background:#333}
.thumb-item:hover{border-color:#555}
.thumb-item.active{border-color:#42a5f5}
.thumb-item.drag-over{border-color:#ffca28;background:#3a3000}
.thumb-num{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);font-size:11px;text-align:center;padding:2px 0;color:#ccc}
.thumb-item canvas{width:100%;display:block}

/* ── Main view ── */
.view-area{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px;background:#3c3c3c}
.page-wrap{position:relative;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.6)}
.page-wrap canvas{display:block}
.annot-canvas{position:absolute;top:0;left:0;pointer-events:none}
.annot-canvas.draw-mode{pointer-events:all}
.text-input-float{position:absolute;background:rgba(255,255,200,.95);border:2px solid #ffca28;border-radius:4px;padding:4px 6px;font-size:14px;color:#000;outline:none;min-width:80px;max-width:300px;resize:both;z-index:100}

/* ── Right panel ── */
.right-panel{width:200px;background:#1e1e1e;border-left:1px solid #333;padding:12px 10px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.rp-section h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#888;margin-bottom:8px}
.rp-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rp-row label{font-size:12px;color:#bbb;min-width:44px}
.rp-row input[type=color]{width:32px;height:24px;border:none;border-radius:3px;cursor:pointer;padding:1px}
.rp-row input[type=range]{flex:1}
.rp-row input[type=number]{width:50px;background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:3px 5px;font-size:12px}
.rp-row select{flex:1;background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 6px;font-size:12px}
.page-info{font-size:12px;color:#888;margin-top:auto;text-align:center}

/* ── Empty state ── */
.empty-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#555}
.empty-view svg{opacity:.4}
.empty-view h2{font-size:20px;color:#666}
.empty-view p{font-size:14px}
.drop-zone-hint{margin-top:8px;padding:16px 28px;border:2px dashed #555;border-radius:10px;font-size:14px;color:#555;text-align:center}

/* ── Progress ── */
.progress-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:12px}
.progress-bar-wrap{width:260px;background:#333;border-radius:10px;height:8px;overflow:hidden}
.progress-bar{height:100%;background:#42a5f5;border-radius:10px;transition:width .1s}
.progress-label{font-size:14px;color:#ccc}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <button class="tb-btn tb-open" id="btnOpen">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>Aç
  </button>
  <input type="file" id="fileInput" accept=".pdf" style="display:none">

  <button class="tb-btn tb-merge" id="btnMerge" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>PDF Ekle
  </button>
  <input type="file" id="mergeInput" accept=".pdf" style="display:none">

  <div class="toolbar-sep"></div>
  <span class="tb-label">Araç:</span>

  <button class="tb-btn tb-tool active" id="toolSelect" data-tool="select" title="Seç">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 0l16 12.279-6.78.665 4.34 7.386-1.925 1.132-4.327-7.4-5.308 3.199z"/></svg>Seç
  </button>
  <button class="tb-btn tb-tool" id="toolText" data-tool="text" title="Metin Ekle">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>Metin
  </button>
  <button class="tb-btn tb-tool" id="toolPen" data-tool="pen" title="Kalem">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Kalem
  </button>
  <button class="tb-btn tb-tool" id="toolHighlight" data-tool="highlight" title="Vurgula">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 17l-5-5-7.07 7.07 2.47 2.47c.39.39 1.02.39 1.41 0l8.19-8.19c.39-.38.39-1.01 0-1.35zM1.5 16.59l7.07-7.07 5 5-7.07 7.07L1.5 16.59zM11 3.5L7.5 7 5 4.5l.71-.71L7.5 5.59l2.79-2.8L11 3.5zm7.54 1.42c-.2-.2-.51-.2-.71 0l-1.06 1.06.71.71 1.06-1.06c.2-.2.2-.51 0-.71z"/></svg>Vurgula
  </button>
  <button class="tb-btn tb-tool" id="toolEraser" data-tool="eraser" title="Silgi">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20h7.66l8.72-8.72c.78-.78.78-2.05 0-2.83l-4.85-4.86c-.4-.39-.91-.59-1.42-.59zm-3.75 14l-4-4L14 6.41 18 10.4 11.39 17z"/></svg>Silgi
  </button>

  <div class="toolbar-sep"></div>

  <button class="tb-btn tb-rotate" id="btnRotL" disabled title="Sola Döndür">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.11 8.53L5.7 7.11C4.8 8.27 4.24 9.61 4.07 11h2.02c.14-.87.49-1.72 1.02-2.47zM6.09 13H4.07c.17 1.39.72 2.73 1.62 3.89l1.41-1.42c-.52-.75-.87-1.59-1.01-2.47zm1.01 5.32c1.16.9 2.51 1.44 3.9 1.61V17.9c-.87-.15-1.71-.49-2.46-1.03L7.1 18.32zM13 4.07V1L8.45 5.55 13 10V6.09c2.84.48 5 2.94 5 5.91s-2.16 5.43-5 5.91v2.02c3.95-.49 7-3.85 7-7.93S16.95 4.56 13 4.07z"/></svg>↺
  </button>
  <button class="tb-btn tb-rotate" id="btnRotR" disabled title="Sağa Döndür">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.55 5.55L11 1v3.07C7.06 4.56 4 7.92 4 12s3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91s2.16-5.43 5-5.91V10l4.55-4.45zM19.93 11c-.17-1.39-.72-2.73-1.62-3.89l-1.42 1.42c.54.75.88 1.6 1.02 2.47h2.02zM13 17.9v2.02c1.39-.17 2.74-.71 3.9-1.61l-1.44-1.44c-.75.54-1.59.89-2.46 1.03zm3.89-2.42l1.42 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.02c-.14.87-.48 1.72-1.02 2.48z"/></svg>↻
  </button>
  <button class="tb-btn tb-del" id="btnDelPage" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Sayfayı Sil
  </button>

  <div class="toolbar-sep"></div>
  <span class="tb-label">Zoom:</span>
  <div class="zoom-box">
    <button class="zoom-btn" id="btnZoomOut">−</button>
    <input type="number" id="zoomInput" value="100" min="25" max="400" step="10">
    <span style="font-size:12px;color:#888">%</span>
    <button class="zoom-btn" id="btnZoomIn">+</button>
  </div>

  <div class="toolbar-sep" style="margin-left:auto"></div>
  <button class="tb-btn tb-dl" id="btnDownload" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>İndir
  </button>
</div>

<!-- Workspace -->
<div class="workspace">
  <!-- Thumbnails -->
  <div class="thumb-panel" id="thumbPanel"></div>

  <!-- Main view -->
  <div class="view-area" id="viewArea">
    <div class="empty-view" id="emptyView">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="#555"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
      <h2>PDF Dosyası Yok</h2>
      <p>Başlamak için bir PDF açın</p>
      <div class="drop-zone-hint" id="dropHint">📂 Dosyayı buraya sürükleyip bırak<br>veya yukarıdaki "Aç" butonunu kullan</div>
    </div>
    <div class="page-wrap" id="pageWrap" style="display:none">
      <canvas id="pdfCanvas"></canvas>
      <canvas class="annot-canvas" id="annotCanvas"></canvas>
    </div>
  </div>

  <!-- Right panel -->
  <div class="right-panel" id="rightPanel">
    <div>
      <div class="rp-section"><h3>Kalem / Metin</h3></div>
      <div class="rp-row"><label>Renk</label><input type="color" id="drawColor" value="#e53935"></div>
      <div class="rp-row"><label>Boyut</label><input type="range" id="drawSize" min="1" max="40" value="4"><input type="number" id="drawSizeNum" value="4" min="1" max="40" style="width:42px"></div>
      <div class="rp-row"><label>Opaklık</label><input type="range" id="drawOpacity" min="10" max="100" value="100"><input type="number" id="drawOpacityNum" value="100" min="10" max="100" style="width:42px"></div>
    </div>
    <div>
      <div class="rp-section"><h3>Sayfa</h3></div>
      <div class="rp-row">
        <button class="tb-btn" id="btnPrev" style="flex:1;background:#333;color:#fff;padding:5px">‹ Önceki</button>
        <button class="tb-btn" id="btnNext" style="flex:1;background:#333;color:#fff;padding:5px">Sonraki ›</button>
      </div>
    </div>
    <div class="page-info" id="pageInfo">—</div>
  </div>
</div>

<!-- Progress overlay -->
<div class="progress-overlay" id="progressOverlay" style="display:none">
  <div class="progress-label" id="progressLabel">İşleniyor…</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Setup ────────────────────────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;

// ─── State ────────────────────────────────────────────────────────────────────
let pdfDoc    = null;   // pdf-lib PDFDocument
let pdfJsDoc  = null;   // PDF.js doc
let curPage   = 0;      // 0-based
let zoom      = 1.0;
let tool      = 'select';
let drawColor = '#e53935';
let drawSize  = 4;
let drawOpacity = 1.0;

// Per-page annotation layers: Map<pageIdx, {strokes: [], texts: []}>
const annotLayers = new Map();

// Drawing state
let isDrawing = false;
let penPoints  = [];
let eraserSize = 20;

// ─── Elements ─────────────────────────────────────────────────────────────────
const fileInput    = document.getElementById('fileInput');
const mergeInput   = document.getElementById('mergeInput');
const pdfCanvas    = document.getElementById('pdfCanvas');
const annotCanvas  = document.getElementById('annotCanvas');
const pageWrap     = document.getElementById('pageWrap');
const emptyView    = document.getElementById('emptyView');
const thumbPanel   = document.getElementById('thumbPanel');
const pageInfo     = document.getElementById('pageInfo');

const ctx          = pdfCanvas.getContext('2d');
const actx         = annotCanvas.getContext('2d');

// ─── Utilities ────────────────────────────────────────────────────────────────
function toast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function setProgress(label, pct) {
  const ov = document.getElementById('progressOverlay');
  const bar = document.getElementById('progressBar');
  const lbl = document.getElementById('progressLabel');
  if (label === null) { ov.style.display = 'none'; return; }
  ov.style.display = 'flex';
  lbl.textContent  = label;
  bar.style.width  = pct + '%';
}

function setUiEnabled(enabled) {
  ['btnMerge','btnRotL','btnRotR','btnDelPage','btnDownload','btnPrev','btnNext']
    .forEach(id => document.getElementById(id).disabled = !enabled);
}

function getLayer(pageIdx) {
  if (!annotLayers.has(pageIdx)) annotLayers.set(pageIdx, { strokes: [], texts: [] });
  return annotLayers.get(pageIdx);
}

// ─── Load PDF ─────────────────────────────────────────────────────────────────
async function loadBytes(bytes) {
  setProgress('PDF yükleniyor…', 20);
  pdfDoc   = await PDFDocument.load(bytes, { ignoreEncryption: true });
  setProgress('Sayfa görüntüleri hazırlanıyor…', 60);
  pdfJsDoc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  curPage  = 0;
  annotLayers.clear();
  setProgress('Tamamlandı', 100);
  setTimeout(() => setProgress(null), 400);
  setUiEnabled(true);
  emptyView.style.display = 'none';
  pageWrap.style.display  = 'inline-block';
  await renderPage();
  await renderAllThumbs();
  toast(`PDF yüklendi — ${pdfDoc.getPageCount()} sayfa`);
}

fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  fileInput.value = '';
  const bytes = new Uint8Array(await file.arrayBuffer());
  await loadBytes(bytes);
});

document.getElementById('btnOpen').addEventListener('click', () => fileInput.click());

// ─── Drag & drop onto view area ───────────────────────────────────────────────
const viewArea = document.getElementById('viewArea');
viewArea.addEventListener('dragover', e => { e.preventDefault(); });
viewArea.addEventListener('drop', async e => {
  e.preventDefault();
  const file = Array.from(e.dataTransfer.files).find(f => f.name.toLowerCase().endsWith('.pdf'));
  if (!file) return;
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (!pdfDoc) await loadBytes(bytes); else await mergePdfBytes(bytes);
});

// ─── Merge PDF ────────────────────────────────────────────────────────────────
mergeInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  mergeInput.value = '';
  const bytes = new Uint8Array(await file.arrayBuffer());
  await mergePdfBytes(bytes);
});

document.getElementById('btnMerge').addEventListener('click', () => mergeInput.click());

async function mergePdfBytes(bytes) {
  setProgress('PDF birleştiriliyor…', 30);
  const other   = await PDFDocument.load(bytes, { ignoreEncryption: true });
  const indices = other.getPageIndices();
  const copied  = await pdfDoc.copyPages(other, indices);
  copied.forEach(p => pdfDoc.addPage(p));
  await refreshPdfJs();
  setProgress(null);
  await renderAllThumbs();
  toast(`${indices.length} sayfa eklendi — toplam ${pdfDoc.getPageCount()} sayfa`);
}

async function refreshPdfJs() {
  const bytes  = await pdfDoc.save();
  pdfJsDoc     = await pdfjsLib.getDocument({ data: bytes }).promise;
}

// ─── Render page ──────────────────────────────────────────────────────────────
async function renderPage() {
  const count = pdfDoc.getPageCount();
  if (curPage >= count) curPage = count - 1;
  if (curPage < 0) curPage = 0;

  const jsPage  = await pdfJsDoc.getPage(curPage + 1);
  const vp      = jsPage.getViewport({ scale: zoom });

  pdfCanvas.width  = vp.width;
  pdfCanvas.height = vp.height;
  annotCanvas.width  = vp.width;
  annotCanvas.height = vp.height;

  await jsPage.render({ canvasContext: ctx, viewport: vp }).promise;
  redrawAnnotLayer();

  pageInfo.textContent = `Sayfa ${curPage + 1} / ${count}`;
  highlightThumb(curPage);
}

// ─── Thumbnail rendering ───────────────────────────────────────────────────────
let thumbRenderAbort = null;

async function renderAllThumbs() {
  if (thumbRenderAbort) thumbRenderAbort.aborted = true;
  const token = { aborted: false };
  thumbRenderAbort = token;

  const count = pdfDoc.getPageCount();
  thumbPanel.innerHTML = '';

  for (let i = 0; i < count; i++) {
    if (token.aborted) return;
    const item = document.createElement('div');
    item.className = 'thumb-item' + (i === curPage ? ' active' : '');
    item.dataset.idx = i;
    item.draggable = true;
    const tc = document.createElement('canvas');
    const num = document.createElement('div');
    num.className = 'thumb-num';
    num.textContent = i + 1;
    item.appendChild(tc);
    item.appendChild(num);
    thumbPanel.appendChild(item);

    // render
    const jsPage = await pdfJsDoc.getPage(i + 1).catch(() => null);
    if (!jsPage || token.aborted) continue;
    const vp = jsPage.getViewport({ scale: 0.22 });
    tc.width  = vp.width;
    tc.height = vp.height;
    await jsPage.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise;

    // events
    item.addEventListener('click', async () => {
      curPage = i;
      await renderPage();
    });
    setupThumbDrag(item, i);
  }
}

function highlightThumb(idx) {
  document.querySelectorAll('.thumb-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}

// ─── Thumbnail drag-to-reorder ────────────────────────────────────────────────
let dragSrc = null;

function setupThumbDrag(el, idx) {
  el.addEventListener('dragstart', e => { dragSrc = idx; e.dataTransfer.effectAllowed = 'move'; });
  el.addEventListener('dragover',  e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', async e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    if (dragSrc === null || dragSrc === idx) return;
    movePage(dragSrc, idx);
    dragSrc = null;
  });
}

function movePage(fromIdx, toIdx) {
  const pages = pdfDoc.getPages();
  const [page] = pages.splice(fromIdx, 1);  // not a real method — we rebuild

  // pdf-lib doesn't expose a direct move; we rebuild the document
  rebuildWithOrder((() => {
    const order = Array.from({ length: pdfDoc.getPageCount() }, (_, i) => i);
    order.splice(fromIdx, 1);
    order.splice(toIdx, 0, fromIdx);
    return order;
  })());
}

async function rebuildWithOrder(order) {
  setProgress('Sayfalar yeniden düzenleniyor…', 40);
  const newDoc = await PDFDocument.create();
  const copied = await newDoc.copyPages(pdfDoc, order);
  copied.forEach(p => newDoc.addPage(p));

  // Migrate annotations (approximate — by order)
  const newLayers = new Map();
  order.forEach((oldIdx, newIdx) => {
    if (annotLayers.has(oldIdx)) newLayers.set(newIdx, annotLayers.get(oldIdx));
  });
  annotLayers.clear();
  newLayers.forEach((v, k) => annotLayers.set(k, v));

  pdfDoc = newDoc;
  curPage = 0;
  await refreshPdfJs();
  setProgress(null);
  await renderPage();
  await renderAllThumbs();
  toast('Sayfalar yeniden düzenlendi');
}

// ─── Rotate ───────────────────────────────────────────────────────────────────
document.getElementById('btnRotL').addEventListener('click', () => rotatePage(-90));
document.getElementById('btnRotR').addEventListener('click', () => rotatePage(90));

async function rotatePage(deg) {
  const page = pdfDoc.getPage(curPage);
  page.setRotation(degrees((page.getRotation().angle + deg + 360) % 360));
  await refreshPdfJs();
  await renderPage();
  renderThumb(curPage);
  toast(`Sayfa ${deg > 0 ? 'sağa' : 'sola'} döndürüldü`);
}

async function renderThumb(idx) {
  const items = document.querySelectorAll('.thumb-item');
  const item  = items[idx];
  if (!item) return;
  const tc = item.querySelector('canvas');
  const jsPage = await pdfJsDoc.getPage(idx + 1).catch(() => null);
  if (!jsPage) return;
  const vp = jsPage.getViewport({ scale: 0.22 });
  tc.width = vp.width; tc.height = vp.height;
  await jsPage.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise;
}

// ─── Delete page ──────────────────────────────────────────────────────────────
document.getElementById('btnDelPage').addEventListener('click', async () => {
  if (pdfDoc.getPageCount() <= 1) { toast('Son sayfa silinemez!'); return; }
  if (!confirm(`Sayfa ${curPage + 1} silinsin mi?`)) return;
  pdfDoc.removePage(curPage);
  annotLayers.delete(curPage);
  if (curPage >= pdfDoc.getPageCount()) curPage = pdfDoc.getPageCount() - 1;
  await refreshPdfJs();
  await renderPage();
  await renderAllThumbs();
  toast('Sayfa silindi');
});

// ─── Annotation layer ─────────────────────────────────────────────────────────
function redrawAnnotLayer() {
  actx.clearRect(0, 0, annotCanvas.width, annotCanvas.height);
  const layer = getLayer(curPage);

  layer.strokes.forEach(s => {
    if (!s.points.length) return;
    actx.save();
    actx.globalAlpha   = s.opacity;
    actx.strokeStyle   = s.color;
    actx.lineWidth     = s.size;
    actx.lineCap       = 'round';
    actx.lineJoin      = 'round';
    if (s.highlight) { actx.globalCompositeOperation = 'multiply'; actx.strokeStyle = s.color; actx.lineWidth = s.size; }
    actx.beginPath();
    actx.moveTo(s.points[0].x, s.points[0].y);
    s.points.forEach(p => actx.lineTo(p.x, p.y));
    actx.stroke();
    actx.restore();
  });

  layer.texts.forEach(t => {
    actx.save();
    actx.globalAlpha = t.opacity;
    actx.fillStyle   = t.color;
    actx.font        = `bold ${t.size * zoom}px Arial`;
    actx.fillText(t.text, t.x, t.y);
    actx.restore();
  });
}

// ─── Canvas input events ──────────────────────────────────────────────────────
function getPos(e) {
  const r = annotCanvas.getBoundingClientRect();
  const sx = annotCanvas.width  / r.width;
  const sy = annotCanvas.height / r.height;
  const cx = (e.clientX - r.left) * sx;
  const cy = (e.clientY - r.top)  * sy;
  return { x: cx, y: cy };
}

annotCanvas.addEventListener('mousedown', e => {
  if (tool === 'select') return;
  if (tool === 'text') { handleTextClick(e); return; }
  isDrawing = true;
  const pos = getPos(e);
  penPoints = [pos];
  if (tool === 'eraser') eraseAt(pos);
});

annotCanvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const pos = getPos(e);
  if (tool === 'eraser') { eraseAt(pos); return; }
  penPoints.push(pos);
  // live draw
  actx.save();
  actx.globalAlpha   = drawOpacity;
  actx.strokeStyle   = drawColor;
  actx.lineWidth     = drawSize;
  actx.lineCap       = 'round';
  actx.lineJoin      = 'round';
  if (tool === 'highlight') { actx.globalCompositeOperation = 'multiply'; actx.lineWidth = drawSize * 4; }
  if (penPoints.length >= 2) {
    const p = penPoints;
    actx.beginPath();
    actx.moveTo(p[p.length - 2].x, p[p.length - 2].y);
    actx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
    actx.stroke();
  }
  actx.restore();
});

annotCanvas.addEventListener('mouseup',    finishDraw);
annotCanvas.addEventListener('mouseleave', finishDraw);

function finishDraw() {
  if (!isDrawing) return;
  isDrawing = false;
  if (tool === 'eraser' || !penPoints.length) return;
  const layer = getLayer(curPage);
  layer.strokes.push({
    points:    penPoints.slice(),
    color:     drawColor,
    size:      tool === 'highlight' ? drawSize * 4 : drawSize,
    opacity:   drawOpacity,
    highlight: tool === 'highlight'
  });
  penPoints = [];
}

function eraseAt(pos) {
  const r = eraserSize;
  const layer = getLayer(curPage);
  layer.strokes = layer.strokes.filter(s => {
    return !s.points.some(p => Math.hypot(p.x - pos.x, p.y - pos.y) < r);
  });
  layer.texts = layer.texts.filter(t => Math.hypot(t.x - pos.x, t.y - pos.y) > 40);
  redrawAnnotLayer();
}

// ─── Text tool ────────────────────────────────────────────────────────────────
function handleTextClick(e) {
  const pos = getPos(e);
  const inp = document.createElement('input');
  inp.type  = 'text';
  inp.className = 'text-input-float';
  inp.placeholder = 'Metin yaz…';
  inp.style.left  = (e.clientX - pageWrap.getBoundingClientRect().left) + 'px';
  inp.style.top   = (e.clientY - pageWrap.getBoundingClientRect().top)  + 'px';
  inp.style.color = drawColor;
  inp.style.fontSize = (drawSize * 3) + 'px';
  pageWrap.appendChild(inp);
  inp.focus();

  function commit() {
    const text = inp.value.trim();
    inp.remove();
    if (!text) return;
    const layer = getLayer(curPage);
    layer.texts.push({ text, x: pos.x, y: pos.y, color: drawColor, size: drawSize * 3, opacity: drawOpacity });
    redrawAnnotLayer();
  }
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') inp.remove(); });
  inp.addEventListener('blur', commit);
}

// ─── Tool buttons ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tb-tool').forEach(btn => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    document.querySelectorAll('.tb-tool').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const drawMode = tool !== 'select';
    annotCanvas.classList.toggle('draw-mode', drawMode);
    annotCanvas.style.cursor = tool === 'pen' || tool === 'highlight' ? 'crosshair'
      : tool === 'eraser' ? 'cell'
      : tool === 'text'   ? 'text'
      : 'default';
  });
});

// ─── Draw settings ────────────────────────────────────────────────────────────
document.getElementById('drawColor').addEventListener('input', e => { drawColor = e.target.value; });
document.getElementById('drawSize').addEventListener('input', e => {
  drawSize = +e.target.value;
  document.getElementById('drawSizeNum').value = drawSize;
});
document.getElementById('drawSizeNum').addEventListener('input', e => {
  drawSize = Math.max(1, Math.min(40, +e.target.value));
  document.getElementById('drawSize').value = drawSize;
});
document.getElementById('drawOpacity').addEventListener('input', e => {
  drawOpacity = +e.target.value / 100;
  document.getElementById('drawOpacityNum').value = e.target.value;
});
document.getElementById('drawOpacityNum').addEventListener('input', e => {
  drawOpacity = Math.max(0.1, Math.min(1, +e.target.value / 100));
  document.getElementById('drawOpacity').value = Math.round(drawOpacity * 100);
});

// ─── Navigation ───────────────────────────────────────────────────────────────
document.getElementById('btnPrev').addEventListener('click', async () => {
  if (!pdfDoc || curPage <= 0) return;
  curPage--;
  await renderPage();
});
document.getElementById('btnNext').addEventListener('click', async () => {
  if (!pdfDoc || curPage >= pdfDoc.getPageCount() - 1) return;
  curPage++;
  await renderPage();
});

// Arrow keys
document.addEventListener('keydown', e => {
  if (!pdfDoc) return;
  if (document.activeElement !== document.body && document.activeElement.tagName !== 'BUTTON') return;
  if (e.key === 'ArrowLeft'  && curPage > 0) { curPage--; renderPage(); }
  if (e.key === 'ArrowRight' && curPage < pdfDoc.getPageCount() - 1) { curPage++; renderPage(); }
});

// ─── Zoom ─────────────────────────────────────────────────────────────────────
document.getElementById('btnZoomIn').addEventListener('click', () => setZoom(zoom + 0.1));
document.getElementById('btnZoomOut').addEventListener('click', () => setZoom(zoom - 0.1));
document.getElementById('zoomInput').addEventListener('change', e => setZoom(+e.target.value / 100));

function setZoom(z) {
  zoom = Math.max(0.25, Math.min(4, z));
  document.getElementById('zoomInput').value = Math.round(zoom * 100);
  if (pdfDoc) renderPage();
}

// Ctrl+scroll zoom
viewArea.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(zoom + (e.deltaY < 0 ? 0.1 : -0.1));
}, { passive: false });

// ─── Download (bake annotations → PDF) ───────────────────────────────────────
document.getElementById('btnDownload').addEventListener('click', async () => {
  if (!pdfDoc) return;
  setProgress('Anotasyonlar uygulanıyor…', 10);

  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const pageCount = pdfDoc.getPageCount();

  for (let pi = 0; pi < pageCount; pi++) {
    const layer = annotLayers.get(pi);
    if (!layer) continue;
    const pdfPage = pdfDoc.getPage(pi);
    const { width: pw, height: ph } = pdfPage.getSize();

    // We need the rendered canvas size to convert coords
    const jsPage = await pdfJsDoc.getPage(pi + 1);
    const vp     = jsPage.getViewport({ scale: 1 });
    const sx     = pw / vp.width;
    const sy     = ph / vp.height;

    setProgress(`Sayfa ${pi + 1} / ${pageCount} işleniyor…`, 10 + (pi / pageCount) * 80);

    // Bake strokes
    layer.strokes.forEach(s => {
      if (s.points.length < 2) return;
      const col = hexToRgb(s.color);
      const pts  = s.points.map(p => ({ x: p.x * sx, y: ph - p.y * sy }));
      for (let i = 1; i < pts.length; i++) {
        pdfPage.drawLine({
          start: { x: pts[i-1].x, y: pts[i-1].y },
          end:   { x: pts[i].x,   y: pts[i].y   },
          thickness:  s.size * sx,
          color:      rgb(col.r, col.g, col.b),
          opacity:    s.opacity
        });
      }
    });

    // Bake texts
    layer.texts.forEach(t => {
      const col = hexToRgb(t.color);
      const fontSize = Math.max(6, t.size * sx);
      pdfPage.drawText(sanitize(t.text), {
        x:       t.x * sx,
        y:       ph - t.y * sy - fontSize,
        size:    fontSize,
        font,
        color:   rgb(col.r, col.g, col.b),
        opacity: t.opacity
      });
    });
  }

  setProgress('PDF kaydediliyor…', 95);
  const bytes = await pdfDoc.save();
  const blob  = new Blob([bytes], { type: 'application/pdf' });
  const url   = URL.createObjectURL(blob);
  const a     = document.createElement('a');
  a.href      = url;
  a.download  = 'duzenlenmiş.pdf';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  setProgress(null);
  toast('PDF indirildi!');
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 };
}

function sanitize(str) {
  // Remove non-Latin-1 chars to avoid pdf-lib encoding errors
  return str.replace(/[^\x00-\xFF]/g, '?');
}
</script>
