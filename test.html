<!DOCTYPE html>
<html>
<head>
    <title>Leaflet Test</title>
    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #f0f0f0; }
        #log { position: fixed; top: 10px; left: 10px; background: #333; color: #0f0; padding: 15px; border: 1px solid #0f0; font-family: monospace; font-size: 12px; max-width: 400px; max-height: 200px; overflow-y: auto; z-index: 9999; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="log"></div>

    <script src="node_modules/leaflet/dist/leaflet.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const logs = [];

        function log(msg) {
            logs.push(msg);
            logEl.textContent = logs.join('\n');
            console.log(msg);
        }

        log('1. Sayfa başladı');
        log('2. Leaflet var mı? ' + (typeof window.L));

        if (window.L) {
            log('3. Leaflet yüklü ✓');
            try {
                const map = L.map('map').setView([41.0082, 28.9784], 13);
                log('4. Harita oluşturuldu ✓');

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
                log('5. Tile layer eklendi ✓');

                L.marker([41.0082, 28.9784]).addTo(map).bindPopup('Test Marker');
                log('6. Marker eklendi ✓');

                log('✅ HER ŞEY ÇALIŞIYOR!');
            } catch (e) {
                log('❌ HATA: ' + e.message);
            }
        } else {
            log('❌ Leaflet yüklenemedi!');
        }
    </script>
</body>
</html>
